<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Pinroute planner</title>
<style>/*CSS*/</style>
</head>
<body>
<div id="app" data-layout="card">
  <header class="top">
    <div class="titles">
      <h1 id="name">Pinroute</h1>
      <p id="sub" class="meta">Loading your trip…</p>
      <p id="status" class="meta" hidden></p>
    </div>
    <div id="side" class="side"></div>
  </header>
  <div id="strip"></div>
  <p id="error" class="note warn" hidden></p>
  <div id="open-row" class="open-row" hidden></div>
  <main id="panes" class="panes" hidden>
    <nav id="list" class="list" aria-label="Route"></nav>
    <section id="detail" class="detail" aria-live="polite"></section>
  </main>
</div>
<script>/*JS*/</script>
</body>
</html>
