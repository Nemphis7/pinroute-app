# Runs the full test suite, planner tests included, on every pull request and on main,
# so a pull request shows whether it is safe to merge before anything reaches Railway.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser for the planner tests
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm test
